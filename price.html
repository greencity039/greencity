<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Private Prices | GreenCity</title>
<link rel="icon" type="image/png" href="images/greencity-logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header solid-header">
  <a class="brand dark-brand" href="index.html">
    <img src="images/greencity-logo.png" alt="GreenCity logo" class="brand-logo">
    <span class="brand-name">GREENCITY</span>
  </a>
  <a href="booking.html" class="header-book">Book</a>
</header>

<main class="private-main">
  <div class="private-card">
    <p class="eyebrow">PRIVATE CUSTOMER ACCESS</p>
    <h1>Price preview.</h1>
    <p>Enter the private code GreenCity sent you on WhatsApp to view current prices.</p>

    <label for="accessCode">Private access code</label>
    <input id="accessCode" type="password" autocomplete="off" placeholder="Enter your code">
    <button id="unlockBtn" class="btn btn-primary">Unlock Prices</button>

    <div id="priceMessage" class="notice" role="alert" aria-live="polite"></div>

    <div id="priceSearch" class="hidden">
      <label for="priceQuery">Filter by vehicle or bin size (optional)</label>
      <input id="priceQuery" placeholder="e.g. bin or wash">
      <div id="priceResults"></div>
    </div>
  </div>
</main>

<footer class="footer simple-footer">
  <div class="footer-bottom">
    <span>© <span data-year></span> GreenCity.</span>
    <a href="index.html">Home</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var config = window.GREENCITY_CONFIG || {};
  var ACCESS_CODE = String(config.PRICE_ACCESS_CODE || "").trim();
  var PRICES = Array.isArray(config.PRICES) ? config.PRICES : [];

  var codeInput = document.getElementById("accessCode");
  var unlockBtn = document.getElementById("unlockBtn");
  var message = document.getElementById("priceMessage");
  var searchBox = document.getElementById("priceSearch");
  var query = document.getElementById("priceQuery");
  var results = document.getElementById("priceResults");

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch];
    });
  }

  function renderPrices(filter) {
    var term = (filter || "").trim().toLowerCase();
    var list = PRICES.filter(function (row) {
      return !term || row.item.toLowerCase().indexOf(term) !== -1;
    });

    if (!list.length) {
      results.innerHTML = '<div class="notice error">No matching prices found. Try a different search term.</div>';
      return;
    }

    results.innerHTML = list.map(function (row) {
      return (
        '<div class="price-result card">' +
          "<span>" + escapeHtml(row.item) + "</span>" +
          "<strong>R" + Number(row.price).toFixed(2) + "</strong>" +
        "</div>"
      );
    }).join("");
  }

  unlockBtn.addEventListener("click", function () {
    var value = codeInput.value.trim();

    if (!value) {
      message.textContent = "Please enter your access code.";
      message.className = "notice error";
      return;
    }

    if (!ACCESS_CODE || value.toLowerCase() !== ACCESS_CODE.toLowerCase()) {
      message.textContent = "Invalid or incorrect access code.";
      message.className = "notice error";
      return;
    }

    codeInput.classList.add("hidden");
    unlockBtn.classList.add("hidden");
    document.querySelector('label[for="accessCode"]').classList.add("hidden");
    searchBox.classList.remove("hidden");
    message.textContent = "Access granted. Here are our current prices.";
    message.className = "notice success";
    renderPrices("");
  });

  codeInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      unlockBtn.click();
    }
  });

  query.addEventListener("input", function () {
    renderPrices(query.value);
  });
});
</script>
</body>
</html>
